name: Build and Test

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop
      - main

jobs:

  backend-tests:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: capital_humano
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5433:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Esperar PostgreSQL
        run: |
          until pg_isready -h localhost -p 5433 -U postgres
          do
            echo "Esperando PostgreSQL..."
            sleep 2
          done

      - name: Ejecutar tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/capital_humano
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

        run: mvn clean test
