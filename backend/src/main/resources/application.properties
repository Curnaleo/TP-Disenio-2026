spring.application.name=evaluaciones

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/capital_humano}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# LDAP
app.ldap.enabled=false
app.ldap.dev-password=admin123

# LDAP productivo
app.ldap.url=ldap://localhost:389
app.ldap.base-dn=dc=capitalhumano,dc=com
